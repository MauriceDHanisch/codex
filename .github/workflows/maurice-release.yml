name: maurice-release

on:
  push:
    tags:
      - "v*-maurice.*"

permissions:
  contents: write

concurrency:
  group: maurice-release
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: codex-rs
    env:
      CARGO_INCREMENTAL: "0"
      SCCACHE_CACHE_SIZE: 5G
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            binaries: codex codex-code-mode-host codex-responses-api-proxy
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            binaries: codex codex-code-mode-host codex-responses-api-proxy bwrap
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            binaries: codex codex-code-mode-host codex-responses-api-proxy bwrap
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Linux build dependencies
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends binutils pkg-config libcap-dev
      - name: Configure musl toolchain
        if: ${{ contains(matrix.target, 'linux-musl') }}
        shell: bash
        run: |
          set -euo pipefail
          cargo_home="${GITHUB_WORKSPACE}/.cargo-home"
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "$GITHUB_ENV"
          echo "${cargo_home}/bin" >> "$GITHUB_PATH"
          : > "${cargo_home}/config.toml"
      - name: Compute cache key
        id: cache_key
        shell: bash
        run: |
          set -euo pipefail
          echo "lockfile=$(sha256sum Cargo.lock | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "toolchain=$(sha256sum rust-toolchain.toml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Restore Cargo dependency cache
        id: cargo_cache
        continue-on-error: true
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ${{ github.workspace }}/.cargo-home/registry/index/
            ${{ github.workspace }}/.cargo-home/registry/cache/
            ${{ github.workspace }}/.cargo-home/git/db/
          key: cargo-release-${{ runner.os }}-${{ matrix.target }}-${{ steps.cache_key.outputs.lockfile }}-${{ steps.cache_key.outputs.toolchain }}
          restore-keys: |
            cargo-release-${{ runner.os }}-${{ matrix.target }}-
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install sccache
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: sccache
          version: 0.7.5
      - name: Configure sccache
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ACTIONS_CACHE_URL:-}" && -n "${ACTIONS_RUNTIME_TOKEN:-}" ]]; then
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
            echo "SCCACHE_DIR=${{ github.workspace }}/.sccache" >> "$GITHUB_ENV"
          fi
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - name: Restore sccache fallback cache
        if: ${{ env.SCCACHE_GHA_ENABLED != 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ github.workspace }}/.sccache/
          key: sccache-release-${{ runner.os }}-${{ matrix.target }}-${{ steps.cache_key.outputs.lockfile }}-${{ github.run_id }}
          restore-keys: |
            sccache-release-${{ runner.os }}-${{ matrix.target }}-${{ steps.cache_key.outputs.lockfile }}-
      - name: Install Zig
        if: ${{ contains(matrix.target, 'linux-musl') }}
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
          use-cache: false
      - name: Install musl build tools
        if: ${{ contains(matrix.target, 'linux-musl') }}
        env:
          TARGET: ${{ matrix.target }}
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/install-musl-build-tools.sh"
      - name: Configure rusty-v8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}
      - name: Build Linux sandbox helper
        if: ${{ contains(matrix.target, 'linux-musl') }}
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          export AWS_LC_SYS_NO_JITTER_ENTROPY=1
          cargo build --target "${target}" --release --bin bwrap
          helper="target/${target}/release/bwrap"
          strip --strip-debug --strip-unneeded "${helper}"
          echo "CODEX_BWRAP_SHA256=$(sha256sum "${helper}" | awk '{print $1}')" >> "$GITHUB_ENV"
          target_no_jitter="AWS_LC_SYS_NO_JITTER_ENTROPY_${target//-/_}"
          echo "${target_no_jitter}=1" >> "$GITHUB_ENV"
      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for binary in ${{ matrix.binaries }}; do
            [[ "${binary}" == "bwrap" ]] || args+=(--bin "${binary}")
          done
          cargo build --target "${{ matrix.target }}" --release "${args[@]}"
      - name: Package release asset
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          package="codex-${target}"
          mkdir -p "dist/${package}/bin"
          for binary in ${{ matrix.binaries }}; do
            cp "target/${target}/release/${binary}" "dist/${package}/bin/${binary}"
          done
          tar -C dist -czf "${package}.tar.gz" "${package}"
      - uses: actions/upload-artifact@v4
        with:
          name: codex-${{ matrix.target }}
          path: codex-rs/codex-${{ matrix.target }}.tar.gz
          if-no-files-found: error
      - name: Save Cargo dependency cache
        if: ${{ always() && !cancelled() && steps.cargo_cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ${{ github.workspace }}/.cargo-home/registry/index/
            ${{ github.workspace }}/.cargo-home/registry/cache/
            ${{ github.workspace }}/.cargo-home/git/db/
          key: cargo-release-${{ runner.os }}-${{ matrix.target }}-${{ steps.cache_key.outputs.lockfile }}-${{ steps.cache_key.outputs.toolchain }}
      - name: Save sccache fallback cache
        if: ${{ always() && !cancelled() && env.SCCACHE_GHA_ENABLED != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ github.workspace }}/.sccache/
          key: sccache-release-${{ runner.os }}-${{ matrix.target }}-${{ steps.cache_key.outputs.lockfile }}-${{ github.run_id }}
      - name: Show sccache statistics
        if: always()
        continue-on-error: true
        run: sccache --show-stats

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        shell: bash
        run: sha256sum codex-*.tar.gz > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TARGET: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${TAG}" \
            --target "${TARGET}" \
            --title "Codex ${TAG}" \
            --generate-notes \
            dist/codex-*.tar.gz dist/SHA256SUMS
