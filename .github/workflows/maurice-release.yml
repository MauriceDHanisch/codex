name: maurice-release

on:
  push:
    tags:
      - "v*-maurice.*"

permissions:
  contents: read

concurrency:
  group: maurice-release
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: codex-rs
    env:
      CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: ${{ contains(matrix.target, 'apple-darwin') && 'packed' || 'off' }}
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            binaries: codex codex-code-mode-host codex-responses-api-proxy
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            binaries: codex codex-code-mode-host codex-responses-api-proxy bwrap
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            binaries: codex codex-code-mode-host codex-responses-api-proxy bwrap
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Linux build dependencies
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends binutils pkg-config libcap-dev
      - name: Configure musl toolchain
        if: ${{ contains(matrix.target, 'linux-musl') }}
        shell: bash
        run: |
          set -euo pipefail
          cargo_home="${GITHUB_WORKSPACE}/.cargo-home"
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "$GITHUB_ENV"
          echo "${cargo_home}/bin" >> "$GITHUB_PATH"
          : > "${cargo_home}/config.toml"
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}
      - name: Install Zig
        if: ${{ contains(matrix.target, 'linux-musl') }}
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0
          use-cache: false
      - name: Install musl build tools
        if: ${{ contains(matrix.target, 'linux-musl') }}
        env:
          TARGET: ${{ matrix.target }}
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/install-musl-build-tools.sh"
      - name: Configure rusty-v8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}
      - name: Build Linux sandbox helper
        if: ${{ contains(matrix.target, 'linux-musl') }}
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          export AWS_LC_SYS_NO_JITTER_ENTROPY=1
          cargo build --target "${target}" --release --bin bwrap
          helper="target/${target}/release/bwrap"
          strip --strip-debug --strip-unneeded "${helper}"
          echo "CODEX_BWRAP_SHA256=$(sha256sum "${helper}" | awk '{print $1}')" >> "$GITHUB_ENV"
          target_no_jitter="AWS_LC_SYS_NO_JITTER_ENTROPY_${target//-/_}"
          echo "${target_no_jitter}=1" >> "$GITHUB_ENV"
      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for binary in ${{ matrix.binaries }}; do
            [[ "${binary}" == "bwrap" ]] || args+=(--bin "${binary}")
          done
          cargo build --target "${{ matrix.target }}" --release --timings "${args[@]}"
      - name: Archive symbols and strip release binaries
        shell: bash
        run: |
          set -euo pipefail
          binaries=()
          for binary in ${{ matrix.binaries }}; do
            [[ "${binary}" == "bwrap" ]] || binaries+=("${binary}")
          done
          bash "${GITHUB_WORKSPACE}/.github/scripts/archive-release-symbols-and-strip-binaries.sh" \
            --target "${{ matrix.target }}" \
            --artifact-name "${{ matrix.target }}" \
            --release-dir "target/${{ matrix.target }}/release" \
            --archive-dir "symbols-dist/${{ matrix.target }}" \
            --binaries "${binaries[*]}"
      - name: Package release asset
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          package="codex-${target}"
          mkdir -p "dist/${package}/bin"
          for binary in ${{ matrix.binaries }}; do
            cp "target/${target}/release/${binary}" "dist/${package}/bin/${binary}"
          done
          tar -C dist -czf "${package}.tar.gz" "${package}"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-${{ matrix.target }}
          path: codex-rs/codex-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 1
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        shell: bash
        run: sha256sum codex-*.tar.gz > SHA256SUMS
      - name: Publish GitHub release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          tag_name: ${{ github.ref_name }}
          name: Codex ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/codex-*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
